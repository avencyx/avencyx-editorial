# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Avencyx Insights Studio — Sveltia CMS configuration.
# The store is the content repository (avencyx-insights), which the website
# consumes as a git submodule at src/content/insights. `base_url` points to
# the OAuth relay (sveltia-cms-auth on Cloudflare Workers) once deployed.

backend:
  name: github
  repo: avencyx/avencyx-insights
  branch: main
  base_url: https://sveltia-cms-auth.catalin-patrascu.workers.dev   # OAuth relay (scripts/editorial/deploy-relay.ps1)

publish_mode: editorial_workflow
site_url: https://www.avencyx.com
display_url: https://www.avencyx.com
logo:
  src: ./logo.svg   # relative: the app is served under a sub-path on GitHub Pages

# Images: stored in the content repository under images/ and referenced as
# /media/insights/<file>; the website copies them into place at build time
# (scripts/sync-insights-media.mjs), which rejects files above 300 KB.
media_folder: images
public_folder: /media/insights

# Uploads are converted in the browser before they reach the repository
# (decision 27 Oct 2026): every raster image (PNG, JPEG, HEIC, …) becomes a
# WebP scaled down to fit 1600 × 1600 px (never enlarged), animated images
# and SVG pass through. The size limit is checked on the converted file, so
# an upload that still exceeds 300 KB is refused here rather than at build.
media_libraries:
  default:
    config:
      max_file_size: 307200
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
          height: 1600
        svg:
          optimize: true

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

i18n:
  structure: multiple_folders
  locales: [en, ro]
  default_locale: en
  # English lives at the collection root, Romanian under ro/ — the site's
  # existing pairing convention (src/utils/i18n.ts).
  omit_default_locale_from_file_path: true
  omit_default_locale_from_preview_path: true

collections:
  - name: insights
    label: Insights
    label_singular: Article
    # Root of the content repository (avencyx-insights); when working with a
    # local repository, pick that repository's folder, not the website's.
    folder: ""
    create: true
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "{{locale}}/insights/{{slug}}/"
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: [publishDate, title]
    view_groups:
      - label: Year
        field: publishDate
        pattern: \d{4}
    fields:
      # English is required to save; Romanian is completed in the same entry
      # but may lag behind while drafting (`required: [en]`).
      - name: title
        label: Title
        widget: string
        i18n: true
        required: [en]
        hint: The article headline (H1).
      - name: seoTitle
        label: SEO title
        widget: string
        required: false
        i18n: true
        hint: "Browser/search title; falls back to “{title} | Avencyx Insights”. Keep under 60 characters."
      - name: description
        label: Description
        widget: text
        i18n: true
        required: [en]
        hint: One or two sentences; used as the intro and the meta description (aim for 120–155 characters).
      # Shown when the article is shared on LinkedIn or Facebook. One picture
      # for both languages; the website cover-crops it to 1200 × 630 and
      # serves it as JPEG, so any landscape photo of at least 1200 × 630 px
      # works. This upload stays JPEG (not WebP): the networks do not
      # document WebP support for og:image.
      - name: ogImage
        label: Social image
        widget: image
        required: true
        i18n: duplicate
        hint: "Landscape photo, at least 1200 × 630 px (1.91:1). The site crops it to the social-card size automatically; keep the subject near the centre."
        media_libraries:
          default:
            config:
              max_file_size: 307200
              transformations:
                raster_image:
                  format: jpeg
                  quality: 85
                  width: 1600
                  height: 1600
      - name: publishDate
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        i18n: duplicate
        hint: Set by the reviewer at publication.
      - name: updatedDate
        label: Updated date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
        i18n: duplicate
      - name: tags
        label: Tags
        widget: list
        default: []
        required: false
        i18n: duplicate
        hint: Short lowercase tags, e.g. nis2, dora, incident-response.
      - name: draft
        label: Draft
        widget: boolean
        default: false
        i18n: duplicate
        hint: Drafts are excluded from the build even after merge.
      # The list itself is mirrored across locales (same questions, same
      # order — items are added or removed in English), while the question
      # and answer text is translated per locale.
      - name: faq
        label: FAQ
        label_singular: Question
        widget: list
        required: false
        i18n: duplicate
        collapsed: false
        summary: "{{fields.q}}"
        fields:
          - name: q
            label: Question
            widget: string
            i18n: true
            required: [en]
          - name: a
            label: Answer
            widget: text
            i18n: true
            required: [en]
      - name: body
        label: Body
        widget: markdown
        i18n: true
        required: [en]
        hint: "Markdown only — headings from H2 down, tables, lists, links. No HTML."
